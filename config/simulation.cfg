# Two-asset configuration (Asset A = alpha, Asset B = beta).
#
# Both assets follow the same theory, geometric Brownian motion:
#
#   F_{t+1} = F_t * exp((mu - sigma^2 / 2) + sigma * zeta)
#
# Drift (mu) and shock (sigma) are per-step LOG RETURNS for every asset, not
# price increments. Values stay strictly positive and are log-normally
# distributed, so each fundamental carries proportional rather than additive
# shocks. Because the units are relative, sigma is directly comparable across
# assets regardless of price level: alpha's 0.0003 and beta's 0.02 are a 0.03%
# and a 2% per-step volatility respectively.
#
# The assets therefore differ only in their parameters -- volatility, drift,
# price level, tick size, and supply -- never in their functional form. Neither
# asset is privileged: both are reported, calibrated, and screened for stylised
# facts on identical terms.
#
# Innovations of the two fundamentals are correlated through
# asset_fundamental_correlation, which is exactly rho_AB in the two-asset
# case. Correlation limits the diversification available to agents: as rho
# approaches 1 the Markowitz rule can no longer reduce risk by spreading
# across assets.
#
# Agents allocate jointly across both through the Markowitz rule, so
# cross-asset covariance shapes the demand for each.
#
# Format: key = value. Relative output paths resolve from this file's directory.

assets = alpha, beta
# Nominates the asset projected into the single-asset step_timeseries.csv view
# kept for legacy tooling. It carries no analytical privilege: reports,
# calibration, and stylised-fact screening cover every enabled asset.
primary_asset = alpha

# Correlation between the standardised fundamental innovations of alpha and
# beta (rho_AB). 0.0 makes them independent; must lie in [-1, 1].
asset_fundamental_correlation = 0.30

# --- Asset A -----------------------------------------------------------------
# Accepted values: gbm (multiplicative, log-return units; the model default) or
# random_walk (additive, price units), retained only for reproducing studies
# that predate the geometric process.
asset.alpha.enabled = 1
asset.alpha.fundamental_process = gbm
asset.alpha.initial_price = 100.0
# Per-agent endowment; aggregate share supply is num_agents * initial_stock.
asset.alpha.initial_stock = 100
asset.alpha.price_tick_size = 0.01
# Log-return units: 0.03% per-step volatility, 0.02% per-step expected growth.
# These are the former arithmetic-walk values (0.03 and 0.02 price units)
# divided by the initial price of 100, so alpha keeps the fundamental dynamics
# it had before adopting the geometric functional form.
asset.alpha.fundamental_shock_std_dev = 0.0003
asset.alpha.fundamental_drift_per_step = 0.0002
asset.alpha.minimum_fundamental_value = 1.0

# --- Asset B -----------------------------------------------------------------
# Set enabled = 0 to collapse this configuration onto the single-asset model.
# Every pre-existing output and report view then renders exactly as before.
asset.beta.enabled = 1
asset.beta.fundamental_process = gbm
asset.beta.initial_price = 40.0
# Per-agent endowment; aggregate share supply is num_agents * initial_stock.
asset.beta.initial_stock = 50
asset.beta.price_tick_size = 0.05
# Log-return units: 2% per-step volatility, -0.05% per-step expected growth.
asset.beta.fundamental_shock_std_dev = 0.02
asset.beta.fundamental_drift_per_step = -0.0005
asset.beta.minimum_fundamental_value = 1.0

time_steps = 2000
warmup_steps = 25
num_fundamentalists = 0
num_chartists = 0
num_noise_traders = 1000
num_buy_and_hold_agents = 0
initial_cash = 10000.0
# Accepted values: true/false, on/off, yes/no, 1/0
short_selling_enabled = 0
# Short-sale constraints:
# - initial margin limits maximum short exposure from agent equity.
# - maintenance margin triggers forced buy-in when losses erode equity.
# - borrowable supply ratio limits aggregate short interest through share lending.
short_sale_initial_margin_requirement = 0.50
short_sale_maintenance_margin_requirement = 0.30
short_sale_borrowable_supply_ratio = 0.20
# Proportional one-way transaction cost paid by each executed trade side.
# A rate of 0.001 means 10 basis points per side; both buyer and seller pay.
transaction_cost_rate = 0.001
transaction_cost_affects_decisions = 0
transaction_cost_apply_to_forced_buy_ins = 0
risk_free_rate = 0.0000
agent_activity_rate = 1
# Warm-up price process only. These values initialise pre-trading price history
# for technical indicators; after warm-up, continuous LOB prices are realised
# transaction prices.
warmup_price_noise_std_dev = 0.005
warmup_fundamental_pull_strength = 0.05
seed = 66
# Trailing log-return observations used to estimate the asset covariance
# matrix that feeds the Markowitz portfolio rule (shared by all agents).
covariance_window = 50

# Continuous persistent limit-order-book microstructure.
market_microstructure = continuous_lob
order_expiry_steps = 19
cancellation_base_probability = 0.0088881301451
cancellation_mispricing_sensitivity = 2.0
market_order_probability = 0.12768911624
market_order_log_gap_threshold = 0.03
# Maximum absolute log distance from the reference price at which a market
# order may execute. 0.0 disables the collar (market orders sweep freely).
market_order_price_collar = 0.0
book_depth_levels = 5

# Set to 0 for a baseline run without Cumulative Prospect Theory valuation.
control_prospect_theory_enabled = 0
# Fraction of the total agent population assigned to use CPT when enabled.
# Exact agent assignment is seeded and reproducible for the same run seed.
control_prospect_theory_agent_fraction = 0.7
# Set to 1 to draw lambda_i, alpha_i, beta_i, and gamma_i per agent.
control_prospect_heterogeneity_enabled = 0
# Cumulative Prospect Theory preferences used to value gain/loss return scenarios.
control_loss_aversion = 3.30477818806
control_loss_aversion_std_dev = 0.640132331692
control_curvature_for_gain = 0.88
control_curvature_for_gain_std_dev = 0.05
control_curvature_for_loss = 0.88
control_curvature_for_loss_std_dev = 0.05
control_prob_distortion_for_gain = 0.61
control_prob_distortion_for_loss = 0.69
# Heterogeneous gamma_i is drawn uniformly from this interval.
control_probability_distortion_min = 0.68646793089
control_probability_distortion_max = 0.833186355751
# Reference price/wealth scale used when agents have no personal entry price.
control_reference_point = 100.0
# Accepted values: configured, average_purchase_price, recent_peak_wealth,
# moving_average_price, initial_wealth.
control_reference_point_mode = average_purchase_price
# Lookback window used only when control_reference_point_mode = moving_average_price.
control_reference_moving_average_window = 20
# Odd number of subjective return scenarios used by Cumulative Prospect Theory.
# Use 3 to preserve the original simple distribution; 5 or 7 gives richer tails.
control_prospect_scenario_count = 13

fundamentalist_mispricing_threshold = 0.001
fundamentalist_stop_loss_threshold = 0.9
fundamentalist_take_profit_threshold = 0.9
# Number of recent one-period log returns used for realised volatility.
fundamentalist_volatility_window = 20
fundamentalist_risk_aversion = 3.0
fundamentalist_min_risky_weight = 0.0
fundamentalist_max_risky_weight = 1.0
# Cap on multi-asset portfolio gross exposure sum_j |w_j|.
fundamentalist_max_gross_exposure = 1.0

chartist_short_window = 5
chartist_long_window = 20
# Deadband for weak short-minus-long moving-average momentum gaps.
# A value of 0.0 preserves the historical MA-crossover rule.
chartist_momentum_signal_threshold = 0.0
# Donchian-style breakout window. Breakout chartists compare the latest price
# with the previous-window high and low; equality is treated as no breakout.
chartist_breakout_window = 20
# Number of recent one-period log returns used for realised volatility.
chartist_volatility_window = 20
# Ignored when short_selling_enabled is false
chartist_max_short_weight = 0.30
chartist_risk_aversion = 3.0
# Lower allocation bound; -0.30 matches chartist_max_short_weight so the
# effective sizing floor max(min_risky_weight, -max_short_weight) stays -0.30.
chartist_min_risky_weight = -0.30
chartist_max_risky_weight = 1.0
# Cap on multi-asset portfolio gross exposure sum_j |w_j|.
chartist_max_gross_exposure = 1.0
# Allowed values: random, momentum, mean_reversion, rsi, breakout.
# Random samples all four chartist rules with the configured deterministic seed.
chartist_strategy_mode = random

# Noise traders submit random-liquidity orders from zero-mean stochastic beliefs.
# They are useful for studying noise-trader risk, liquidity demand, and the
# limits of arbitrage during crisis-like regimes.
noise_trader_belief_shock_std_dev = 0.00531278323029
noise_trader_order_size_fraction = 0.121745202107
# Ignored when short_selling_enabled is false.
noise_trader_max_short_weight = 0.30

# Buy-and-hold agents represent passive long-only investors. They keep buying
# until their risky-asset portfolio share reaches this target, then hold until
# the simulation ends.
buy_hold_target_risky_weight = 0.60

# Social influence and spatial quote formation
social_enabled = 0
social_space_width = 1.0
social_space_height = 1.0
social_interaction_radius = 0.4
# Strength or sensitivity of opinion adjustment to neighbour's opinion
social_opinion_kappa = 0.9
social_hold_tolerance = 0.01
# Mesures the strength of social influence to agent
social_gamma_min = 0.50
social_gamma_max = 0.99
# Standard deviation of private signal noise
social_private_signal_std_min = 0.05
social_private_signal_std_max = 0.10

# Latest-run convenience outputs used when experiment archiving is disabled.
# Archived experiment runs override these paths and place every artefact under
# data/experiments/<experiment_name>/<run_id>/.
simulation_csv_output = ../data/latest/step_timeseries.csv
agent_csv_output = ../data/latest/agents_final.csv

# Long-format per-(step, asset) diagnostics; step_timeseries.csv keeps the
# primary asset's single-asset view for calibration and legacy tooling.
asset_timeseries_enabled = 1
asset_timeseries_csv_output = ../data/latest/asset_timeseries.csv

# Detailed counterparty-level trade ledger. Keep disabled for large calibration
# sweeps because stylised-fact metrics use aggregate step diagnostics, while
# the full ledger can consume substantial memory and disk space.
trade_ledger_enabled = 1
trade_ledger_csv_output = ../data/latest/trade_ledger.csv
summary_metrics_csv_output = ../data/latest/summary_metrics.csv
stylised_facts_csv_output = ../data/latest/stylised_facts.csv
config_json_output = ../data/latest/config.json
metadata_json_output = ../data/latest/metadata.json
run_log_output = ../data/latest/logs/run.log

# PostgreSQL persistence. The C++ simulator still writes temporary staging
# artefacts first; when this switch is enabled, Python imports the completed run
# into PostgreSQL using the connection URL stored in the named environment
# variable. Keep disabled until PostgreSQL is installed and ABM_DATABASE_URL is
# configured on the local machine.
database_output_enabled = 0
database_url_env = ABM_DATABASE_URL
database_prune_after_import = 0

# Reproducible experiment archive.
# When enabled, the executable creates:
# ../data/experiments/<experiment_name>/
#   <timestamp>_<prospect_theory>_<prospect_heterogeneity>_<social_enabled>_
#   <short_sale>_<num_fundamentalists>_<num_chartists>_<num_noise_traders>_
#   <num_buy_and_hold_agents>_<time_steps>_<seed>/
# Each run folder receives:
#   config_used.cfg
#   config.json
#   metadata.json
#   step_timeseries.csv
#   agents_final.csv
#   trade_ledger.csv (only when trade_ledger_enabled = 1)
#   summary_metrics.csv
#   stylised_facts.csv
#   logs/run.log
# The experiment_manifest.csv file is the master index for comparing runs
# across behavioural-finance settings and random seeds.
experiment_output_enabled = 1
experiment_root = ../data/experiments
experiment_name = demo
run_label = two asset example

# Automatic Python visualisation after each completed C++ run.
# When enabled, the single-run report is written to
# <run>/python_analysis/index.html and opened in the default browser.
# When experiment archiving is enabled, the comparison report is refreshed at
# <experiment>/comparison_reports/latest/index.html, but it is not opened
# automatically.
python_analysis_enabled = 1
python_analysis_python = ../.venv/bin/python
python_analysis_generate_comparison = 1
python_analysis_max_comparison_runs = 8