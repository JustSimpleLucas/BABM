[build-system]
requires = ["setuptools>=69", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "abm-analysis"
version = "0.1.0"
description = "Python analysis workflow for behavioural-finance ABM experiment archives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arch>=8.0",
    "fastapi>=0.115",
    "numpy>=1.26",
    "optuna>=4.0",
    "pandas>=2.3",
    "plotly>=6.1",
    "psycopg[binary]>=3.2",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
abm-analysis = "abm_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["analysis/python"]
include = ["abm_analysis*"]

[tool.setuptools.package-data]
abm_analysis = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["analysis/python"]
testpaths = ["tests/python"]
